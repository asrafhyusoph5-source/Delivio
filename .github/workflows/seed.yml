name: Seed Firestore

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Write service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > seed/serviceAccount.json
          cp seed/serviceAccount.json seed/serviceAccountKey.json
      - name: Install and seed
        working-directory: seed
        run: |
          npm install firebase-admin
          node seed.js
