name: Build Delivio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Delivio Upload,O=Delivio,C=US"
          fi

      - name: Configure Google Services (Firebase)
        env:
          GOOGLE_SERVICES_PLAIN: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_PLAIN" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing"; exit 1
          fi
          mkdir -p app
          echo "$GOOGLE_SERVICES_PLAIN" > app/google-services.json
          PKG=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "applicationId: $PKG"
          grep -o '"package_name": *"[^"]*"' app/google-services.json
          if ! grep -q "\"package_name\": *\"$PKG\"" app/google-services.json; then
            echo "ERROR: google-services.json does not contain package $PKG"; exit 1
          fi
          echo "Firebase config OK"

      - name: Configure Maps Key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          KEY="${MAPS_API_KEY:-DEFAULT_MAPS_KEY}"
          echo "MAPS_API_KEY=\"$KEY\"" > .env
          echo "MAPS_API_KEY=$KEY" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Delivio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
