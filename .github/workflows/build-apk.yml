name: Build Delivio APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Ensure Android Keystores Exist
        run: |
          # 1. Restore or generate debug.keystore
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Provide fallback release keystore with alias 'upload' if not present
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating fallback upload keystore with alias 'upload'..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Delivio Upload,O=Delivio,C=US"
          fi

      - name: Configure Google Services (Firebase)
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_PLAIN: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "Decoding google-services.json from GitHub Secret..."
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_PLAIN" ]; then
            echo "Writing google-services.json from GitHub Secret..."
            echo "$GOOGLE_SERVICES_PLAIN" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Writing default google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "delivio-app",
              "storage_bucket": "delivio-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.costumerdelivery.fxdkqw"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyDelivioCustomerAppKeyForBuild000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # Ensure google-services.json always has a matching client for the exact applicationId
          python3 - << 'PYEOF'
          import json, re, copy

          pkg = "com.aistudio.costumerdelivery.fxdkqw"
          try:
              with open("app/build.gradle.kts", "r") as f:
                  m = re.search(r'applicationId\s*=\s*"([^"]+)"', f.read())
                  if m:
                      pkg = m.group(1).strip()
          except Exception as e:
              print(f"Error reading gradle file: {e}")

          print(f"Checking client matching package name: {pkg}")
          gs_path = "app/google-services.json"
          try:
              with open(gs_path, "r") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Recreating JSON due to: {e}")
              data = {
                  "project_info": {
                      "project_number": "123456789012",
                      "project_id": "delivio-app",
                      "storage_bucket": "delivio-app.appspot.com"
                  },
                  "client": [],
                  "configuration_version": "1"
              }

          clients = data.get("client", [])
          matched = any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == pkg for c in clients)

          if not matched:
              print(f"Adding client entry for package '{pkg}'...")
              if clients:
                  new_c = copy.deepcopy(clients[0])
                  new_c.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = pkg
                  clients.append(new_c)
              else:
                  clients.append({
                      "client_info": {
                          "mobilesdk_app_id": f"1:123456789012:android:{pkg.replace('.', '')[:14]}",
                          "android_client_info": { "package_name": pkg }
                      },
                      "oauth_client": [],
                      "api_key": [{ "current_key": "AIzaSyDummyDelivioCustomerAppKeyForBuild000" }],
                      "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
                  })
              data["client"] = clients

          with open(gs_path, "w") as f:
              json.dump(data, f, indent=2)

          print("Verified google-services.json successfully.")
          PYEOF

      - name: Configure Secrets & Environment
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          touch .env
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=\"$MAPS_API_KEY\"" > .env
          else
            echo "MAPS_API_KEY=\"DEFAULT_MAPS_KEY\"" > .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
          KEYSTORE_PATH: "my-upload-key.jks"
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: Delivio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: ${{ success() && github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: Delivio-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
