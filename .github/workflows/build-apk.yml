name: Build Delivio APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Google Services Configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_PLAIN: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "Decoding google-services.json from secret..."
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_PLAIN" ]; then
            echo "Writing google-services.json from secret..."
            echo "$GOOGLE_SERVICES_PLAIN" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Creating minimal google-services.json placeholder for CI..."
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "123456789012",
                "project_id": "delivio-app",
                "storage_bucket": "delivio-app.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                    "android_client_info": {
                      "package_name": "com.example"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "dummy_api_key_for_ci_build"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Configure Environment Secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            echo "Injecting MAPS_API_KEY into .env..."
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> .env
          else
            echo "Using default/empty MAPS_API_KEY..."
            touch .env
            echo "MAPS_API_KEY=" >> .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: delivio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: delivio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
